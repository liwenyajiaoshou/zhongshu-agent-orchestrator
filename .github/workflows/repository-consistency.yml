name: Repository Consistency Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Run Repository Validator
      run: python scripts/validate_repository.py

    - name: Run Runtime Pack Builder
      run: python scripts/build_runtime_pack.py
