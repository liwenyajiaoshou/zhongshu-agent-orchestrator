# 模型路由配置
# 核心 Skill 只使用 tier，不把具体模型名称写死在行为逻辑中。
# 可根据可用模型、价格和能力更新此文件。

tiers:
  low:
    preferred_model: "GPT-5.6 Luna"
    default_reasoning: "medium"
    suitable_for:
      - "A 类小补丁"
      - "只读 Reality Check"
      - "报告修正"
      - "边界清晰测试任务"

  medium:
    preferred_model: "GPT-5.6 Terra"
    default_reasoning: "medium"
    suitable_for:
      - "B 类多文件普通工程"
      - "局部模块增强"
      - "普通重构"
      - "中等范围兼容修复"

  high:
    preferred_model: "GPT-5.6 Sol"
    default_reasoning: "high"
    suitable_for:
      - "C 类复杂架构"
      - "跨系统根因"
      - "高风险业务语义"
      - "生产/正式数据相关决策"

mechanical:
  preferred_tool: "Antigravity"
  use_when:
    - "高重复低判断密度"
    - "批量机械编辑"
    - "截图与视觉验收"
    - "格式整理"
  avoid_when:
    - "需要复杂代码语义判断"
    - "需要跨模块架构推理"

rules:
  - "先判断任务规模，再选择模型。"
  - "质量满足要求时优先较低 tier。"
  - "不要因为任务重要就自动使用最高 tier。"
  - "如果较低 tier 连续暴露真实能力不足，再升级，不因保险心理升级。"


codex_switching:
  scope: "Codex 线程专用，不约束网页版对话线程"

  decision_order:
    - "先判断 Codex 上下文是否健康且具有高价值"
    - "再判断当前模型能力是否足够"
    - "若模型能力足够，优先提高推理等级，不换模型"
    - "若模型能力不足，已有实质上下文时默认新开 Codex 线程并升级模型"
    - "若上下文污染，即使模型不变也优先新开 Codex 线程"
    - "模型降级同样默认通过新 Codex 线程完成"

  same_thread_model_switch:
    default: false
    allowed_only_when:
      - "Codex 线程刚创建"
      - "尚未发生实质施工"
      - "工具调用很少"
      - "尚未形成重要中间判断"
      - "没有高价值上下文需要保留"

  reasoning_first_when:
    - "当前模型对问题结构理解基本正确"
    - "当前上下文健康且强关联"
    - "任务仍处于当前模型能力范围"
    - "主要缺口是需要更深推理而非更高能力上限"

  new_thread_and_upgrade_model_when:
    - "较高推理等级下仍多轮无法收敛"
    - "持续遗漏跨模块关系"
    - "无法稳定维护复杂约束"
    - "根因判断反复推翻"
    - "任务明显超过当前模型推荐档位"
